<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Übung – {{name}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 32'%3E%3Crect width='26' height='32' rx='3' fill='%232340b5'/%3E%3Crect width='5' height='32' rx='2' fill='%23172f8e'/%3E%3Crect x='8' y='11' width='14' height='9' rx='1.5' fill='white'/%3E%3C/svg%3E">
<script src="kopf.js?v={{version}}"></script>
<link rel="preload" href="schriften/playpen-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="h5p-archiv.css?v={{version}}">
<script src="uebungen.js?v={{version}}" defer blocking="render"></script>
<script src="seite.js?v={{version}}" defer blocking="render"></script>
<script src="player/standalone/main.bundle.js" defer></script>
<script src="spielen.js?v={{version}}" defer blocking="render"></script>
<!-- Übungen vorladen, sobald der Zeiger auf einem Link ruht. Muss in index.html und spielen.html gleich bleiben: die CSP erlaubt die Regeln per Hash (container/sws.toml) -->
<script type="speculationrules">{"prerender": [{"where": {"selector_matches": "a[href^='spielen.html?id=']"}, "eagerness": "moderate"}]}</script>
</head>
<body class="uebungsseite">
<a class="skip" href="#blatt">Zur Übung springen</a>

{{kopf}}

<main id="inhalt" data-laedt>
  <header class="uebung-kopf" id="kopf">
    <div class="innen schmal">
      <a class="fach-link" id="fach-link" href="./" hidden></a>
      <h1 id="titel">Übung</h1>
      <ul class="merkmale" id="merkmale"></ul>
    </div>
  </header>

  <div class="innen schmal buehne">
    <div id="hinweise"></div>
    <section class="blatt" id="blatt" tabindex="-1" aria-label="Übung"><div id="h5p-container"></div></section>
    <div class="ergebnis" id="ergebnis" hidden></div>
    <p class="sr-only" id="ergebnis-ansage" role="status"></p>

    <div class="blatt-leiste" id="leiste">
      <div class="links" id="werkzeuge"></div>
      <details class="lehrkraefte" id="lehrkraefte" hidden>
        <summary>Für Lehrkräfte</summary>
        <div class="lehrkraefte-inhalt" id="lehrkraefte-inhalt"></div>
      </details>
    </div>

    <nav class="blaettern" id="blaettern" aria-label="Weitere Übungen im Fach" hidden></nav>

    <section class="verwandt" id="verwandt" aria-labelledby="verwandt-titel" hidden>
      <h2 id="verwandt-titel">Mehr in diesem Fach</h2>
      <ul class="hefte" id="verwandt-liste"></ul>
    </section>
  </div>
</main>

{{fuss}}
</body>
</html>
